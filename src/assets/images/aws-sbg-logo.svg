<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9" fill="#A166FF" shape-rendering="crispEdges">
  <!-- AWS Student Builder Group mark: square frame with three teeth on each side -->
  <!-- top -->
  <rect x="2" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="6" y="0" width="1" height="1"/>
  <rect x="2" y="1" width="5" height="1"/>
  <!-- bottom -->
  <rect x="2" y="7" width="5" height="1"/>
  <rect x="2" y="8" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/>
  <!-- left -->
  <rect x="0" y="2" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/>
  <rect x="1" y="2" width="1" height="5"/>
  <!-- right -->
  <rect x="7" y="2" width="1" height="5"/>
  <rect x="8" y="2" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/>
</svg>
